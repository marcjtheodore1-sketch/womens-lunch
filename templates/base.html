<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}LAGC Autistic Women's Lunch{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/womens-lunch">🍽️ LAGC Autistic Women's Lunch</a>
            <a href="https://londonautismgroupcharity.org" target="_blank" rel="noopener noreferrer">
                <img src="{{ url_for('static', filename='images/charity_logo.jpg') }}" alt="London Autism Group Charity Logo" class="nav-logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="/womens-lunch" class="nav-link">Home</a>
            <a href="/womens-lunch/book" class="nav-link">Book Lunch</a>
            <a href="https://cafdonate.cafonline.org/30442" class="nav-link" target="_blank">Donate</a>
            <a href="https://www.londonautismgroupcharity.org/#newsletter" class="nav-link" target="_blank">Sign Up</a>
            <a href="https://tinyurl.com/lagcnews200526" class="nav-link" target="_blank">Newsletter</a>
            <a href="/admin/womens-lunch" class="nav-link">Admin</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <a href="https://londonautismgroupcharity.org" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='images/charity_logo.jpg') }}" alt="London Autism Group Charity Logo" class="footer-logo">
        </a>
        <p><a href="https://londonautismgroupcharity.org" target="_blank" rel="noopener noreferrer">London Autism Group Charity</a> - Autistic Women's Lunch</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
